plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

android {
    namespace "com.professor.app"
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "PROFESSOR.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.professor.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // قناة الدفع الرسمية من جوجل (FCM) — نفس التي تستخدمها التطبيقات العالمية
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"

    // حارس الخلفية الاحتياطي: يعيد تشغيل خدمة التنبيهات إن قتلها النظام
    implementation "androidx.work:work-runtime:2.10.0"
}
